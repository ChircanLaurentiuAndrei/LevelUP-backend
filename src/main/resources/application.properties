spring.application.name=levelup

# Local PostgreSQL Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/levelup_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false

# JWT Configuration (3 hours TTL)
jwt.secret=${JWT_SECRET:very-long-secret-key-at-least-32-characters-long-for-hmac-sha-256}
jwt.expiration=10800000

app.gamification.xp-per-level=100
app.gamification.daily-task-limit=8
app.gamification.min-program-tasks=4
