services:
  db:
    image: postgres:16-alpine
    container_name: levelup-db
    environment:
      POSTGRES_DB: levelup_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./levelup_db.sql:/docker-entrypoint-initdb.d/levelup_db.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d levelup_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: levelup-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/levelup_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: default_local_development_jwt_secret_at_least_32_characters_long
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
